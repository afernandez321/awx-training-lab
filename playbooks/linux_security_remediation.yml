      tags:
        - cis
        - security

    - role: ssh_permissions
      tags:
        - ssh_permissions
        - ssh
        - security

    - role: ssh_hardening
      tags:
        - ssh_hardening
        - ssh
        - security

    - role: password_policy
      tags:
        - password_policy
        - password
        - security

    - role: pam_hardening
      tags:
        - pam_hardening
        - pam
        - security

    - role: filesystem_permissions
      tags:
        - filesystem_permissions
        - filesystem
        - security

    - role: audit_configuration
      tags:
        - audit_configuration
        - audit
        - security
