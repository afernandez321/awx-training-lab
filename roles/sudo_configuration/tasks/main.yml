---
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Configure passwordless sudo users
  ansible.builtin.template:
    src: sudoers-users.j2
    dest: /etc/sudoers.d/aap-managed-users
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
