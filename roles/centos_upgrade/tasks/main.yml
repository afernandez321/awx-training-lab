---
- name: Upgrade all CentOS packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  register: centos_upgrade_result

- name: Check whether reboot is required
  ansible.builtin.command:
    cmd: needs-restarting -r
  register: centos_reboot_check
  changed_when: false
  failed_when: false

- name: Display patching result
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "Packages changed: {{ centos_upgrade_result.changed }}"
      - "Reboot required: {{ centos_reboot_check.rc == 1 }}"

- name: Reboot CentOS when required
  ansible.builtin.reboot:
    msg: "Reboot initiated by AWX after patching"
    connect_timeout: 10
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 15
    test_command: whoami
  when: centos_reboot_check.rc == 1

- name: Confirm server is available after patching
  ansible.builtin.ping:
