---
# SSH hardening configuration

# ---------------------------------------------------------------------------
# SERVICE
# ---------------------------------------------------------------------------

- name: Determine SSH service name
  ansible.builtin.set_fact:
    ssh_hardening_service_name: >-
      {{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}

# ---------------------------------------------------------------------------
# PRECHECK
# ---------------------------------------------------------------------------

- name: Check SSH daemon configuration file
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: ssh_hardening_config

- name: Fail if sshd_config does not exist
  ansible.builtin.assert:
    that:
      - ssh_hardening_config.stat.exists
      - ssh_hardening_config.stat.isreg
    fail_msg: "/etc/ssh/sshd_config was not found."

# ---------------------------------------------------------------------------
# DEBIAN CONFIGURATION
# ---------------------------------------------------------------------------

- name: Manage Debian SSH hardening settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^\\s*#?\\s*{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: "PermitRootLogin", value: "{{ ssh_hardening_permit_root_login }}" }
    - { key: "PasswordAuthentication", value: "{{ ssh_hardening_password_authentication }}" }
    - { key: "PubkeyAuthentication", value: "{{ ssh_hardening_pubkey_authentication }}" }
    - { key: "MaxAuthTries", value: "{{ ssh_hardening_max_auth_tries }}" }
    - { key: "LoginGraceTime", value: "{{ ssh_hardening_login_grace_time }}" }
    - { key: "IgnoreRhosts", value: "{{ ssh_hardening_ignore_rhosts }}" }
    - { key: "HostbasedAuthentication", value: "{{ ssh_hardening_hostbased_authentication }}" }
    - { key: "ClientAliveInterval", value: "{{ ssh_hardening_client_alive_interval }}" }
    - { key: "ClientAliveCountMax", value: "{{ ssh_hardening_client_alive_count_max }}" }
  loop_control:
    label: "{{ item.key }}"
  when: ansible_facts.os_family == "Debian"
  notify: Validate and reload SSH

- name: Enforce Debian X11Forwarding setting
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '(?im)^[ \t]*#?[ \t]*X11Forwarding[ \t]+.*$'
    replace: 'X11Forwarding {{ ssh_hardening_x11_forwarding }}'
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  when: ansible_facts.os_family == "Debian"
  notify: Validate and reload SSH

# ---------------------------------------------------------------------------
# RED HAT CONFIGURATION
# ---------------------------------------------------------------------------

- name: Manage Red Hat SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
    content: |
      # Managed by Ansible - ssh_hardening role
      PermitRootLogin {{ ssh_hardening_permit_root_login }}
      PasswordAuthentication {{ ssh_hardening_password_authentication }}
      PubkeyAuthentication {{ ssh_hardening_pubkey_authentication }}
      MaxAuthTries {{ ssh_hardening_max_auth_tries }}
      LoginGraceTime {{ ssh_hardening_login_grace_time }}
      X11Forwarding {{ ssh_hardening_x11_forwarding }}
      IgnoreRhosts {{ ssh_hardening_ignore_rhosts }}
      HostbasedAuthentication {{ ssh_hardening_hostbased_authentication }}
      ClientAliveInterval {{ ssh_hardening_client_alive_interval }}
      ClientAliveCountMax {{ ssh_hardening_client_alive_count_max }}
  when: ansible_facts.os_family == "RedHat"
  notify: Validate and reload SSH

# ---------------------------------------------------------------------------
# APPLY HANDLERS BEFORE EFFECTIVE VALIDATION
# ---------------------------------------------------------------------------

- name: Flush SSH handlers before validation
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

# ---------------------------------------------------------------------------
# EFFECTIVE CONFIGURATION VALIDATION
# ---------------------------------------------------------------------------

- name: Read effective SSH configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false
  when: not ansible_check_mode

- name: Validate effective SSH hardening configuration
  ansible.builtin.assert:
    that:
      - "'permitrootlogin ' ~ ssh_hardening_permit_root_login | lower in ssh_hardening_effective.stdout"
      - "'passwordauthentication ' ~ ssh_hardening_password_authentication | lower in ssh_hardening_effective.stdout"
      - "'pubkeyauthentication ' ~ ssh_hardening_pubkey_authentication | lower in ssh_hardening_effective.stdout"
      - "'maxauthtries ' ~ ssh_hardening_max_auth_tries | string in ssh_hardening_effective.stdout"
      - "'logingracetime ' ~ ssh_hardening_login_grace_time | string in ssh_hardening_effective.stdout"
      - "'x11forwarding ' ~ ssh_hardening_x11_forwarding | lower in ssh_hardening_effective.stdout"
      - "'ignorerhosts ' ~ ssh_hardening_ignore_rhosts | lower in ssh_hardening_effective.stdout"
      - "'hostbasedauthentication ' ~ ssh_hardening_hostbased_authentication | lower in ssh_hardening_effective.stdout"
      - "'clientaliveinterval ' ~ ssh_hardening_client_alive_interval | string in ssh_hardening_effective.stdout"
      - "'clientalivecountmax ' ~ ssh_hardening_client_alive_count_max | string in ssh_hardening_effective.stdout"
    fail_msg: "Effective SSH configuration does not match the required hardening policy."
    success_msg: "Effective SSH hardening configuration validated."
  when: not ansible_check_mode
